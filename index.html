<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset='UTF-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TellME7 ATM Simulator</title>
    <link rel="stylesheet" href="style.css">  
</head>
<body>
    <div class="mainScreen">
        <div id="mainScreen" class="screen-active">
            <div class="atm-screen">
                <!-- Кнопка Инициализация кассет слева сверху -->
                <button class="atm-button top-left" onclick="initCassettes()">
                    Инициализация кассет
                </button>
                <!-- Кнопка Инкассация ресайклера     -->
                <button class="atm-button top-right" onclick="recyclCollection">
                    Инкассация ресайклера
                </button>
                <!-- Кнопка Меню оператора -->
                <button class="atm-button bottom-right" onclick="goToSupervisor()">
                    Меню оператора
                </button>
                <!-- Кнопка "Выход" -->
                <button class="atm-button bottom-left exit" onclick="exitApp()">
                    Выход
                </button>     
            </div>
        </div>
    </div>

    <!-- Экран Меню оператора -->
    <div id="supervisorscreen" class="screen" style="display: none;">
        <div class="atm-screen">

            <!-- Левая верхняя кнопка Выключить банкомат -->
            <button class="atm-button top-left" onclick="shutdownATM()">
                Выключить<br>банкомат
            </button>

            <!-- Правая верхняя кнопка В режим обслуживания клиентов -->
             <button class="atm-button normal-mode" onclick="gotoNormalMode()">
                В режим обслуживания клиентов
            </button>

            <!-- Левая средняя кнопка Открытие/закрытие операционного дня -->
             <button class="atm-button OpenCloseDay" onclick="openCloseDay()">
                Открытие/закрытие<br>операционного дня
             </button>

            <!-- Правая средняя кнопка Состояние устройств -->
             <button class="atm-button device-status" onclick="DeviceStatus()">
                Состояние устройств
             </button>
        </div>
    </div>
    
    <script>
        // Переключение между экранами
        function showMainMenu() {
            document.getElementById('mainScreen').style.display = 'block';
            document.getElementById('supervisorscreen').style.display = 'none';
        }

        function showSupervisorMenu() {
            document.getElementById('mainScreen').style.display = 'none';
            document.getElementById('supervisorscreen').style.display = 'block'
        }
       
        // Функции главного меню
        function exitApp() {
            let answer = confirm("Вы уверены, что хотите выйти?");
            if (answer = true) {
                alert("До свидания!");
            }
        }

        function initCassettes() {
            alert("Инициализация кассет");
        }

        function recyclCollection() {
            alert("Инкассация ресайклера")
        }

        function goToSupervisor() {
            alert("Переход в меню оператора");
        }

        // Функции меню оператора
        function shutdownATM() {
            let answer = confirm('Вы уверены, что хотите выключить банкомат?');
            if (answer == true) {alert('Банкомат выключается...')

            }
        }

        // Функция "Состояние устройств"
        function device-status() {
            alert('Переход на экран "Состояние устройств"')
        }
    </script>    
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset='UTF-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TellME7 ATM Simulator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="atm-container">
        <!-- Главный экран -->
        <div id="mainScreen" class="atm-screen">
            <button class="atm-button top-left" onclick="initCassettes()">ИНИЦИАЛИЗАЦИЯ КАССЕТ</button>
            <button class="atm-button top-right" onclick="recyclCollection()">ИНКАССАЦИЯ РЕСАЙКЛЕРА</button>
            <button class="atm-button bottom-right" onclick="showSupervisorMenu()">МЕНЮ ОПЕРАТОРА</button>
            <button class="atm-button exit-button" onclick="exitApp()">Выход</button>
        </div>

        <!-- Экран меню оператора -->
        <div id="supervisorScreen" class="atm-screen" style="display: none;">
            <!-- Заголовок экрана -->
            <div class="screen-title">ОСНОВНОЙ ЭКРАН ОПЕРАТОРА</div>
            <button class="atm-button supervisor-nottoservice" onclick="NottoService()">В РЕЖИМ<br>БАНКОМАТ 
                НЕ ОБСЛУЖИВАЕТ</button>
            <button class="atm-button supervisor-shutdown" onclick="shutdownATM()">ВЫКЛЮЧИТЬ<br>БАНКОМАТ
            </button>
            <button class="atm-button supervisor-service" onclick="showMainMenu()">В РЕЖИМ ОБСЛУЖИВАНИЯ<br>КЛИЕНТОВ
            </button>
            <button class="atm-button supervisor-openclose" onclick="openCloseDay()">ОТКРЫТИЕ/ЗАКРЫТИЕ
                <br>ОПЕРАЦИОННОГО ДНЯ</button>
            <button class="atm-button supervisor-devices" onclick="deviceStatus()">СОСТОЯНИЕ
                УСТРОЙСТВ
            </button>
        </div>
        <!-- Экран "ОТКРЫТИЕ\ЗАКРЫТИЕ ОПЕРАЦИОННОГО ДНЯ" -->
        <div id="opencloseday" class="atm-screen" style="display: none;">
            <div class="screen-title">ОТКРЫТИЕ\ЗАКРЫТИЕ ОПЕРАЦИОННОГО ДНЯ</div>
            <button class="atm-button opencloseday-recycler" onclick="recyclerday()">РЕСАЙКЛЕР</button>
            <button class="atm-button opencloseday-backtosupervisor" onclick="backtosupervisor()">ВОЗВРАТ</button>
            <button class="atm-button opencloseday-backtonormal" onclick="backtonormal()">В РЕЖИМ ОБСЛУЖИВАНИЯ 
                <br>КЛИЕНТОВ
            </button>
            <button class="atm-button opencloseday-extraoperation" onclick="extraoperation()">ДОПОЛНИТЕЛЬНЫЕ<br>
                ОПЕРАЦИИ</button>
        </div>
        <!-- Экран "ОПЕРАЦИОННЫЙ ДЕНЬ РЕСАЙКЛЕРА" -->
         <div id="recyclerday" class="atm-screen" style="display: none;">
            <div class="screen-title">ОПЕРАЦИОННЫЙ ДЕНЬ РЕСАЙКЛЕРА</div>
            <button class="atm-button recyclerday-openday" onclick="openrecyclerday()">ОТКРЫТИЕ ОПЕРАЦИОННОГО<br>
                 ДНЯ</button>
            <button class="atm-button recyclerday-closeday" onclick="closerecyclerday()">ЗАКРЫТИЕ ОПЕРАЦИОННОГО<br>
                ДНЯ</button>
            <button class="atm-button recyclerday-printbalance" onclick="printbalance()">ПЕЧАТЬ БАЛАНСА</button>
            <button class="atm-button recyclerday-previous" onclick="рrevious()">ВОЗВРАТ</button>
            <button class="atm-button recyclerday-backtonormal" onclick="backtonormal()">В РЕЖИМ ОБСЛУЖИВАНИЯ<br>
                КЛИЕНТОВ</button>
            <button class="atm-button recyclerday-intermediateresult" onclick="intermediateresult()">ПРОМЕЖУТОЧНЫЕ
                 РЕЗУЛЬТАТЫ</button>    
         </div>
         <!-- ЭКРАН "ЗАКРЫТИЕ ОПЕРАЦИОННОГО ДНЯ"  -->
         <div id="closerecyclerday" class="atm-screen" style="display: none;">
            <div class="screen-title">ЗАКРЫТИЕ ОПЕРАЦИОННОГО ДНЯ</div>
            <button class="atm-button closeday" onclick="Continue()">ПРОДОЛЖИТЬ</button>
         </div>
        <!-- Экран "ЗАГРУЗКА КАССЕТЫ 1" -->
        <div id="replenishcassette_1" class="atm-screen" style="display: none;">
            <div class="screen-title">ВВЕДИТЕ ЗАГРУЗКУ КАССЕТЫ 1</div>
                <!-- Кнопки -->
                <button class="atm-button cancel-btn" onclick="Cancel()">ОТМЕНА</button>
                <button class="atm-button reset-btn" onclick="Reset()">ОБНУЛИТЬ</button>
                <button class="atm-button enter-btn" onclick="Enter()">ВВОД</button>
        </div>
         <!-- Экран "ЗАГРУЗКА КАССЕТЫ 2" -->
         <div id="replenishcassette_2" class="atm-screen" style="display: none;">
            <div class="screen-title">ВВЕДИТЕ ЗАГРУЗКУ КАССЕТЫ 2</div>
            <button class="atm-button cancel" onclick="Cancel()">ОТМЕНА</button>
            <button class="atm-button reset" onclick="Reset()">ОБНУЛИТЬ</button>
            <button class="atm-button enter" onclick="Enter()">ВВОД</button>
         </div>
        <!-- Экран "ЗАГРУЗКА КАССЕТЫ 3" -->
         <div id="replenishcassette_3" class="atm-screen" style="display: none;">
            <div class="screen-title">ВВЕДИТЕ ЗАГРУЗКУ КАССЕТЫ 3</div>
            <button class="atm-button cancel" onclick="Cancel()">ОТМЕНА</button>
            <button class="atm-button reset" onclick="Reset()">ОБНУЛИТЬ</button>
            <button class="atm-button enter" onclick="Enter()">ВВОД</button>
         </div>
         <!-- Экран "ЗАГРУЗКА КАССЕТЫ 4" -->
         <div id="replenishcassette_4" class="atm-screen" style="display: none;">
            <div class="screen-title">ВВЕДИТЕ ЗАГРУЗКУ КАССЕТЫ 4</div>
            <button class="atm-button cancel" onclick="Cancel()">ОТМЕНА</button>
            <button class="atm-button reset" onclick="Reset()">ОБНУЛИТЬ</button>
            <button class="atm-button enter" onclick="Enter()">ВВОД</button>
         </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
    <script src="js/supervisor.js"></script> 
    <script src="js/openclosedaymenu.js"></script>
    <script src="js/recyclerdaymenu.js"></script> 
    <script src="js/closerecyclerday.js"></script>
    <script src="js/openrecyclersdaycreens.js"></script>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset='UTF-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TellME7 ATM Simulator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="atm-container">
        <!-- Главный экран -->
        <div id="mainScreen" class="atm-screen">
            <button class="atm-button top-left" onclick="initCassettes()">ИНИЦИАЛИЗАЦИЯ КАССЕТ</button>
            <button class="atm-button top-right" onclick="recyclCollection()">ИНКАССАЦИЯ РЕСАЙКЛЕРА</button>
            <button class="atm-button bottom-right" onclick="showSupervisorMenu()">МЕНЮ ОПЕРАТОРА</button>
            <button class="atm-button exit-button" onclick="exitApp()">Выход</button>
        </div>

        <!-- Экран меню оператора (скрыт) -->
        <div id="supervisorScreen" class="atm-screen" style="display: none;">
            <button class="atm-button supervisor-nottoservice" onclick="NottoService()">В РЕЖИМ<br>БАНКОМАТ 
                НЕ ОБСЛУЖИВАЕТ</button>
            <button class="atm-button supervisor-shutdown" onclick="shutdownATM()">ВЫКЛЮЧИТЬ<br>БАНКОМАТ
            </button>
            <button class="atm-button supervisor-service" onclick="showMainMenu()">В РЕЖИМ ОБСЛУЖИВАНИЯ<br>КЛИЕНТОВ
            </button>
            <button class="atm-button supervisor-openclose" onclick="openCloseDay()">ОТКРЫТИЕ/ЗАКРЫТИЕ
                <br>ОПЕРАЦИОННОГО ДНЯ</button>
            <button class="atm-button supervisor-devices" onclick="deviceStatus()">СОСТОЯНИЕ
                УСТРОЙСТВ
            </button>
        </div>
        <!-- Экран "ОТКРЫТИЕ\ЗАКРЫТИЕ ОПЕРАЦИОННОГО ДНЯ" -->
        <div id="opencloseday" class="atm-screen" style="display: none;">
            <button class="atm-button opencloseday-recycler" onclick="recyclerday()">РЕСАЙКЛЕР</button>
            <button class="atm-button opencloseday-backtosupervisor" onclick="backtosupervisor()">ВОЗВРАТ</button>
            <button class="atm-button opencloseday-backtonormal" onclick="backtonormal()">В РЕЖИМ ОБСЛУЖИВАНИЯ 
                <br>КЛИЕНТОВ
            </button>
            <button class="atm-button opencloseday-extraoperation" onclick="extraoperation()">ДОПОЛНИТЕЛЬНЫЕ<br>
                ОПЕРАЦИИ</button>
        <!-- Экран "ОПЕРАЦИОННЫЙ ДЕНЬ РЕСАЙКЛЕРА" -->
         <div id="recyclerday" class="atm-screen" style="display: none;">
            <button class="atm-button recyclerday-openday" onclick="openrecyclerday()" >ОТКРЫТИЕ ОПЕРАЦИОННОГО
                 ДНЯ</button>
            <button class="atm-button recyclerday-closeday" onclick="closerecyclerday()">ЗАКРЫТИЕ ОПЕРАЦИОННОГО 
                ДНЯ</button>
            <button class="atm-button recyclerday-printbalance" onclick="printbalance()">ПЕЧАТЬ БАЛАНСА</button>
            <button class="atm-button recyclerday-previous" onclick="рrevious()">ВОЗВРАТ</button>
            <button class="atm-button recyclerday-backtonormal" onclick="backtonormal()">В РЕЖИМ ОБСЛУЖИВАНИЯ
                КЛИЕНТОВ</button>
            <button class="atm-button recyclerday-intermediateresult" onclick="intermediateresult()">ПРОМЕЖУТОЧНЫЕ
                 РЕЗУЛЬТАТЫ</button>    
         </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
    <script src="js/supervisor.js"></script> 
    <script src="js/openclosedaymenu.js"></script>
    <script src="js/recyclerdaymenu.js"></script> 
</body>
</html>
